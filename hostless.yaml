build:
  system: docker
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024

dockerfile_path: ./Dockerfile

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024

health_check:
  type: tcp
  interval_in_seconds: 30